name: R Statistics Tests

on:
  push:
    branches: [ main, agents ]
    paths:
      - 'src/rstatistics/**'
      - 'test/rstatistics/**'
      - 'renv.lock'
      - '.github/workflows/r-statistics.yml'
  pull_request:
    branches: [ main, agents ]
    paths:
      - 'src/rstatistics/**'
      - 'test/rstatistics/**'
      - 'renv.lock'
      - '.github/workflows/r-statistics.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev protobuf-compiler libprotobuf-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Run tests
        run: Rscript -e "testthat::test_dir('test/rstatistics', reporter = 'Summary')"
